<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <form>
      <fieldset class="info">
        <legend class="info-title">Ваши личные данные</legend>
        <label class="label">
          Ваше имя
          <input type="text" placeholder="Имя" required />
        </label>
        <label class="label">
          Ваш возраст
          <input
            type="number"
            inputmode="numeric"
            placeholder="Возраст"
            required
          />
        </label>
        <label class="label">
          Ваш номер
          <input type="tel" inputmode="tel" placeholder="Номер" required />
        </label>
        <label class="label">
          Ваша почта
          <input type="email" inputmode="email" placeholder="Почта" required />
        </label>
      </fieldset>
      <fieldset class="message">
        <label class="label">
          Сообщение
          <textarea name="message" required placeholder="Сообщение"></textarea>
        </label>
        <label class="label-checkbox">
          <input type="checkbox" required class="checkbox" />
          Я принимаю правила
        </label>
      </fieldset>
      <button class="button">Отправить</button>
    </form>
  </body>
</html>
